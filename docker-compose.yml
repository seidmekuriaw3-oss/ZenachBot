services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://zenach:zenach_password@postgres:5432/zenach
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: zenach
      POSTGRES_USER: zenach
      POSTGRES_PASSWORD: zenach_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenach -d zenach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
